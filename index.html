<!DOCTYPE html>
<html lang="en">
<head>

    <style nonce="xyz">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        }
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.6;
            transform: translateZ(0);
            will-change: transform;
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            transform: translateZ(0);
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 30, 30, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 8px solid transparent;
            border-top: 8px solid #facc15;
            border-right: 8px solid #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 1.5s ease-in-out infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
            50% { box-shadow: 0 0 20px rgba(249, 115, 22, 1); }
            100% { box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .logo-container {
            max-width: 160px;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .logo-container img:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.5));
        }
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }
        .welcome-text {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(90deg, #facc15, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        .welcome-text span {
            display: inline-block;
            opacity: 0;
        }
        p.subtitle {
            color: #d1d5db;
            margin-bottom: 2rem;
            font-size: 1.25rem;
            max-width: 600px;
            animation: slideIn 1.5s ease-in-out;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .btn-access, .btn-skip {
            width: 100%;
            max-width: 300px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 1rem 2rem;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-decoration: none;
            border: none;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        .btn-skip {
            background: linear-gradient(90deg, #6b7280, #4b5563);
            max-width: 200px;
            font-size: 0.9rem;
        }
        .btn-access:hover, .btn-skip:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
            background: linear-gradient(90deg, #2563eb, #1e40af);
        }
        .btn-skip:hover {
            background: linear-gradient(90deg, #4b5563, #374151);
        }
        .btn-access::before, .btn-skip::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn-access:hover::before, .btn-skip:hover::before {
            width: 400px;
            height: 400px;
        }
        .btn-access i {
            margin-right: 0.8rem;
            font-size: 1.5rem;
        }
        #chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        #chatbot-button {
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s infinite ease-in-out;
        }
        #chatbot-button:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.5);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #chatbot-window {
            display: none;
            width: 340px;
            height: 480px;
            background: rgba(30, 30, 30, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            flex-direction: column;
            overflow: hidden;
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #chatbot-window.open {
            transform: translateY(0);
            opacity: 1;
        }
        @media (max-width: 600px) {
            #chatbot-window {
                width: 100%;
                right: 0;
                bottom: 0;
                border-radius: 15px 15px 0 0;
            }
            .welcome-text {
                font-size: 2.2rem;
            }
            p.subtitle {
                font-size: 1rem;
            }
            .logo-container {
                max-width: 120px;
            }
        }
        #chatbot-header {
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chatbot-toggle {
            background: none;
            border: none;
            color: #1e40af;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #chatbot-messages {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        #chatbot-input {
            display: flex;
            border-top: 1px solid #4b5563;
        }
        #chatbot-input input {
            flex-grow: 1;
            border: none;
            padding: 12px;
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #ffffff;
        }
        #chatbot-input input:focus {
            outline: none;
        }
        #chatbot-input button {
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        #chatbot-input button:hover {
            background: linear-gradient(90deg, #eab308, #ea580c);
        }
        .chatbot-message {
            margin: 8px 0;
            padding: 12px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideMessage 0.3s ease;
        }
        @keyframes slideMessage {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .chatbot-message.bot {
            background: #f97316;
            color: #ffffff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chatbot-message.user {
            background: #4b5563;
            color: #ffffff;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .footer-badges {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            padding: 1rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            background: #4b5563;
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            color: #60a5fa;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .badge:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            color: #facc15;
        }
        .badge img {
            width: 28px;
            height: 28px;
            margin-right: 0.6rem;
            transition: transform 0.3s ease;
        }
        .badge:hover img {
            transform: rotate(360deg);
        }
        footer p {
            text-align: center;
            padding-bottom: 1rem;
            color: #a3a3a3;
            font-size: 0.9rem;
        }
        .dark-mode {
            background: linear-gradient(135deg, #1e40af, #2563eb);
        }
        .dark-mode .subtitle {
            color: #bfdbfe;
        }
        .dark-mode .badge {
            background: #1e1e1e;
            color: #93c5fd;
        }
        .dark-mode .badge:hover {
            color: #facc15;
        }
        button:focus, a:focus {
            outline: 2px solid #f97316;
            outline-offset: 2px;
        }
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 1000;
        }
        .mute-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .dark-mode-toggle label, .mute-toggle label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .dark-mode-toggle input, .mute-toggle input {
            display: none;
        }
        .dark-mode-toggle .slider, .mute-toggle .slider {
            width: 44px;
            height: 24px;
            background: #4b5563;
            border-radius: 24px;
            position: relative;
            transition: background 0.3s ease;
        }
        .dark-mode-toggle input:checked + .slider, .mute-toggle input:checked + .slider {
            background: #f97316;
        }
        .dark-mode-toggle .slider::before, .mute-toggle .slider::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s ease;
        }
        .dark-mode-toggle input:checked + .slider::before, .mute-toggle input:checked + .slider::before {
            transform: translateX(20px);
        }
        .dark-mode-toggle i, .mute-toggle i {
            position: absolute;
            font-size: 12px;
            color: #1e40af;
            transition: opacity 0.3s ease;
        }
        .dark-mode-toggle .sun {
            left: 6px;
            opacity: 1;
        }
        .dark-mode-toggle .moon {
            right: 6px;
            opacity: 0;
        }
        .dark-mode-toggle input:checked + .slider .sun {
            opacity: 0;
        }
        .dark-mode-toggle input:checked + .slider .moon {
            opacity: 1;
        }
        .mute-toggle .sound-on {
            left: 6px;
            opacity: 1;
        }
        .mute-toggle .sound-off {
            right: 6px;
            opacity: 0;
        }
        .mute-toggle input:checked + .slider .sound-on {
            opacity: 0;
        }
        .mute-toggle input:checked + .slider .sound-off {
            opacity: 1;
        }
    </style>
    <script nonce="xyz">
        // Initialize tsParticles for background dots
        if (window.matchMedia('(min-device-pixel-ratio: 2)').matches) {
            tsParticles.load('particles-js', {
                particles: {
                    number: { value: 60 },
                    color: { value: '#60a5fa' },
                    shape: { type: 'circle' },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    move: { enable: true, speed: 1.5, direction: 'none', random: true }
                }
            });
        }

        // Parallax effect for background video
        document.addEventListener('mousemove', (e) => {
            const video = document.getElementById('background-video');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            video.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
        });
    </script>
</head>
<body>
    <audio id="click-sound" src="./assets/click.wav" preload="auto"></audio>
    <video id="background-video" autoplay loop muted playsinline poster="https://via.placeholder.com/1920x1080.png?text=Video+Fallback">
        <source src="https://static.vecteezy.com/system/resources/previews/024/670/480/mp4/abstract-bright-blue-dna-molecular-structure-animated-background-motion-graphic-design-medical-clip-ultra-hd-4k-3840x2160-free-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div id="particles-js"></div>
    <div id="loading-overlay">
        <div class="loader"></div>
    </div>
    <header>
        <div class="logo-container">
            <a href="./index.html" aria-label="GenZZ Library Home">
                <img src="./assets/logo.png" alt="GenZZ Library Logo">
            </a>
        </div>
    </header>
    <div class="dark-mode-toggle">
        <label for="darkModeToggle">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider">
                <i class="bi bi-brightness-high sun"></i>
                <i class="bi bi-moon-stars-fill moon"></i>
            </span>
        </label>
    </div>
    <div class="mute-toggle">
        <label for="muteToggle">
            <input type="checkbox" id="muteToggle">
            <span class="slider">
                <i class="bi bi-volume-up-fill sound-on"></i>
                <i class="bi bi-volume-mute-fill sound-off"></i>
            </span>
        </label>
    </div>
    <main>
        <h1 class="welcome-text">Welcome to GenZZ Library 🚀</h1>
        <p class="subtitle">Free Study Materials for 10th-12th, JEE, NEET & More! Join our vibrant community of learners!</p>
        <button class="btn-access" id="continue-btn" aria-label="Continue to Library">
            <i class="bi bi-arrow-right-circle"></i> Continue
        </button>
        <button class="btn-skip" id="skip-btn" aria-label="Skip to Library">Skip Intro</button>
    </main>
    <div id="chatbot-container">
        <button id="chatbot-button" aria-label="Open chatbot">
            <i class="bi bi-chat-dots-fill" style="font-size: 24px;"></i>
        </button>
        <div id="chatbot-window" style="display: none; flex-direction: column;">
            <div id="chatbot-header">
                GenZZ Chatbot 😎
                <button id="chatbot-toggle">−</button>
            </div>
            <div id="chatbot-messages" role="log" aria-live="polite"></div>
            <div id="chatbot-input">
                <input type="text" id="chatbot-input-text" placeholder="Ask anything..." aria-label="Chatbot input">
                <button id="chatbot-input-button" aria-label="Send message">Send</button>
            </div>
        </div>
    </div>
    <footer id="footer">
        <div class="footer-badges">
            <a href="https://t.me/genzzthinks" class="badge" target="_blank" rel="noopener noreferrer" aria-label="Join Telegram Group" data-tippy-content="Join our Telegram Group">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Group" loading="lazy"> Group
            </a>
            <a href="https://t.me/genzcoders1" class="badge" target="_blank" rel="noopener noreferrer" aria-label="Join Telegram Channel" data-tippy-content="Join our Telegram Channel">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Channel" loading="lazy"> Channel
            </a>
            <a href="https://github.com/genzz-library" class="badge" target="_blank" rel="noopener noreferrer" aria-label="Visit GitHub" data-tippy-content="Check our GitHub">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" loading="lazy"> GitHub
            </a>
            <a href="https://www.instagram.com/genzzcoders" class="badge" target="_blank" rel="noopener noreferrer" aria-label="Follow on Instagram" data-tippy-content="Follow us on Instagram">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" loading="lazy"> Instagram
            </a>
            <a href="mailto:arshtyagi007@gmail.com" class="badge" aria-label="Contact Us" data-tippy-content="Contact us via Email">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Mail_%28iOS%29.svg" alt="Email" loading="lazy"> Email
            </a>
        </div>
        <p>Made with ❤️ by GenZZ-Coders | Video by Vecteezy</p>
    </footer>
</body>
