<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZZ Library</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #333;
            color: white;
            width: 100%;
            text-align: center;
            padding: 1rem;
        }
        header img {
            max-width: 150px;
        }
        nav {
            margin: 1rem;
        }
        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        nav a:hover {
            color: #007bff;
        }
        main {
            text-align: center;
            padding: 2rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <img src="./assets/logo.png" alt="GenZZ Library Logo">
    </header>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/home.html">Chatbot</a>
        <a href="/admin.html">Admin</a>
    </nav>
    <main>
        <h1>Welcome to GenZZ Library</h1>
        <p>Explore our AI-powered chatbot or manage content as an admin.</p>
        <button onclick="playClickSound()">Click Me</button>
    </main>
    <audio id="click-sound" src="./assets/click.wav" preload="auto"></audio>
    <script src="./js/index.js"></script>
</body>
</html>
