                    <div class="form-group">
                        <label for="title">Book Title</label>

                        </div>

                        </div>

                    </div>
                    <div class="form-group">
                        <label for="pdfLink">PDF Link (Google Drive)</label>
                        <input type="url" id="pdfLink" placeholder="Enter Google Drive shareable link" required>
                    </div>
                    <div class="form-group">
                        <label for="class">Class</label>
                        <select id="class" required>
                            <option value="">Select Class</option>
                            <option value="all">All</option>
                            <option value="10th">10th</option>
                            <option value="11th">11th</option>
                            <option value="12th">12th</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exam">Exam</label>
                        <select id="exam" required>
                            <option value="">Select Exam</option>
                            <option value="all">All</option>
                            <option value="Board">Board</option>
                            <option value="JEE">JEE</option>
                            <option value="NEET">NEET</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Add Book</button>
                </form>
            </div>
            <div class="books-list">
                <h3>Existing Books</h3>
                <div class="filter-group">
                    <input type="text" id="search-books" placeholder="Search by title or author">
                    <select id="filter-class">
                        <option value="">Filter by Class</option>
                        <option value="all">All</option>
                        <option value="10th">10th</option>
                        <option value="11th">11th</option>
                        <option value="12th">12th</option>
                    </select>

                        <option value="Board">Board</option>
