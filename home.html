    <script nonce="xyz">
        // Initialize tsParticles for background dots (optional, if you want to replace video)
        if (window.matchMedia('(min-device-pixel-ratio: 2)').matches) {
            tsParticles.load('particles-js', {
                particles: {
                    number: { value: 50 },
                    color: { value: '#60a5fa' },
                    shape: { type: 'circle' },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    move: { enable: true, speed: 1, direction: 'none', random: true }
                }
            });
        }

        // Debounce utility
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Dark mode persistence
            const darkModeToggle = document.getElementById('darkModeToggle');
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkModeToggle.checked = true;
            }
            darkModeToggle.addEventListener('change', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', darkModeToggle.checked);
            });

            // Search autocomplete
            new Autocomplete('#search', {
                search: async input => {
                    if (input.length < 2) return [];
                    try {
                        const response = await fetch(`https://genzz-backend.onrender.com/api/books/search?q=${encodeURIComponent(input)}`);
                        const books = await response.json();
                        return books.map(book => book.title);
                    } catch (error) {
                        console.error('Search error:', error);
                        return [];
                    }
                }
            });

            // Debounced search
            const searchInput = document.getElementById('search');
            searchInput.addEventListener('input', debounce(() => {
                loadBooks(1); // Reset to page 1 on search
            }, 300));

            // Filter change
            document.querySelectorAll('.filter-group select').forEach(select => {
                select.addEventListener('change', () => {
                    loadBooks(1); // Reset to page 1 on filter change
                });
            });

            // Favorite button
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-favorite')) {
                    const bookId = e.target.dataset.id;
                    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                    if (favorites.includes(bookId)) {
                        favorites = favorites.filter(id => id !== bookId);
                        e.target.classList.remove('active');
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: 'Removed from favorites',
                            showConfirmButton: false,
                            timer: 1500
                        });
                    } else {
                        favorites.push(bookId);
                        e.target.classList.add('active');
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: 'Added to favorites',
                            showConfirmButton: false,
                            timer: 1500
                        });
                    }
                    localStorage.setItem('favorites', JSON.stringify(favorites));
                }
            });

            // Modal handling
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-preview')) {
                    const book = JSON.parse(e.target.dataset.book);
                    const modal = document.getElementById('book-modal');
                    modal.innerHTML = `
                        <h4>${DOMPurify.sanitize(book.title)}</h4>
                        <img src="${DOMPurify.sanitize(book.image_url)}" alt="Cover">
                        <p><strong>Author:</strong> ${DOMPurify.sanitize(book.author)}</p>
                        <p><strong>Class:</strong> ${DOMPurify.sanitize(book.class)}</p>
                        <p><strong>Exam:</strong> ${DOMPurify.sanitize(book.exam)}</p>
                        <p><strong>Category:</strong> ${DOMPurify.sanitize(book.category || 'General')}</p>
                        <p><strong>PDF Link:</strong> <a href="${DOMPurify.sanitize(book.link)}" target="_blank">View</a></p>
                        <button class="btn-close">Close</button>
                    `;
                    modal.style.display = 'block';
                }
            });

            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-close')) {
                    document.getElementById('book-modal').style.display = 'none';
                }
            });

            // Chatbot toggle
            document.getElementById('chatbot-toggle').addEventListener('click', () => {
                const window = document.getElementById('chatbot-window');
                window.style.height = window.style.height === '60px' ? '480px' : '60px';
                window.querySelector('#chatbot-messages').style.display = 
                    window.style.height === '60px' ? 'none' : 'block';
                window.querySelector('#chatbot-input').style.display = 
                    window.style.height === '60px' ? 'none' : 'flex';
            });

            // Tooltips
            tippy('.btn-favorite', { content: 'Add to favorites', theme: 'light' });
            tippy('.btn-preview', { content: 'View book details', theme: 'light' });
            tippy('.btn-download', { content: 'Download PDF', theme: 'light' });
        });
    </script>
