<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GEN-ZZ-CODERS | Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #0f172a, #020617);
      font-family: 'Orbitron', sans-serif;
      color: #38bdf8;
      text-align: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap');

    .container {
      padding: 2rem;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 4.5rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.3rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }

    .glow {
      font-size: 2rem;
      color: #0ea5e9;
      text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
      margin-bottom: 1rem;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 6px solid #1e3a8a;
      border-top: 6px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    .team {
      margin-top: 2rem;
      font-size: 1rem;
      color: #60a5fa;
      letter-spacing: 1px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glow">👾 POWERED BY GENZZ-CODERS</div>
    <h1>Coming Soon</h1>
    <p>Something Legendary is Cooking for the GEN-Z Generation...</p>
    <div class="loader"></div>
    <div class="team">© 2025 | Made with ⚡ by GENZZ-CODERS</div>
  </div>

</body>
</html>
